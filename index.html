<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
<title>Game Access</title>
<meta property="og:locale" content="en-US" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Game Access" />
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --error-color: #ef4444;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .login-header { text-align: center; margin-bottom: 1.5rem; }
    .login-header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    .login-header p { color: var(--text-muted); font-size: 0.875rem; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.875rem; margin-bottom: 0.5rem; color: var(--text-muted); }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      margin-bottom: 0.75rem;
    }

    .btn-submit:last-child {
      margin-bottom: 0;
    }

    .btn-submit:disabled, .form-group input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error-box {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
    #dashboard[hidden], #login-view[hidden] { display: none; }
    #links { display: grid; gap: 0.75rem; margin: 1.5rem 0; }
    .link-card { display: block; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); padding: 1rem; text-decoration: none; }
    .link-card:hover, .link-card:focus-visible { border-color: var(--accent-color); }
    .link-card strong, .link-card span { display: block; }
    .link-card span { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
  </style>
</head>
<body>

  <div class="login-container" id="login-view">
    <div class="login-header">
      <h1>Login</h1>
      <p>Sign in with your Google account</p>
    </div>

    <div id="error-box" class="error-box" style="display: none;"></div>

    <form id="login-form">
      <button type="submit" id="submit-btn" class="btn-submit">Continue with Google</button>
    </form>
  </div>

  <div class="login-container" id="dashboard" hidden>
    <div class="login-header">
      <h1>Game Access</h1>
      <p id="dashboard-status" aria-live="polite">Loading your destinations…</p>
    </div>
    <div id="links"></div>
    <button type="button" id="sign-out" class="btn-submit">Sign Out</button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { SUPABASE_OAUTH_REDIRECT_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_URL } from './supabase-config.js';

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const loginView = document.getElementById('login-view');
    const dashboard = document.getElementById('dashboard');
    const status = document.getElementById('dashboard-status');
    const links = document.getElementById('links');
    const signOutButton = document.getElementById('sign-out');

    if (SUPABASE_URL.includes('YOUR_PROJECT') || SUPABASE_PUBLISHABLE_KEY.includes('YOUR_') || SUPABASE_OAUTH_REDIRECT_URL.includes('YOUR_')) {
      errorBox.textContent = 'This site has not been configured for sign-in yet.';
      errorBox.style.display = 'block';
      submitBtn.disabled = true;
      throw new Error('Supabase configuration is missing.');
    }

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Redirecting to Google...';
      errorBox.style.display = 'none';

      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: SUPABASE_OAUTH_REDIRECT_URL }
        });
        if (error) throw error;
      } catch (error) {
        console.error('[game-access]', error);
        errorBox.textContent = 'Unable to start Google sign-in. Please try again.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    });

    let displayedUserId = null;

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
        void renderSession(session);
      }
    });

    async function renderSession(session) {
      if (!session) {
        displayedUserId = null;
        dashboard.hidden = true;
        loginView.hidden = false;
        submitBtn.disabled = false;
        submitBtn.innerText = 'Continue with Google';
        return;
      }

      if (displayedUserId === session.user.id) return;
      displayedUserId = session.user.id;

      // Trigger auto-masking only AFTER successful authentication if not already inside iframe
      if (window.self === window.top && !window.location.href.includes('is_masked=true')) {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('is_masked', 'true');
        const maskedUrl = window.location.pathname + '?' + urlParams.toString() + window.location.hash;

        const win = window.open('about:blank', '_blank');
        if (win) {
          win.document.open();
          win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>Google</title>
              <style>
                html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
                iframe { border: none; width: 100%; height: 100%; }
              </style>
            </head>
            <body>
              <iframe src="${maskedUrl}"></iframe>
            </body>
            </html>
          `);
          win.document.close();
          window.location.replace('https://www.google.com');
          return;
        }
      }

      await showDashboard();
    }

    async function showDashboard() {
      loginView.hidden = true;
      dashboard.hidden = false;
      links.replaceChildren();
      status.textContent = 'Loading your destinations…';
      const { data, error } = await supabase
        .from('user_links')
        .select('label, href, description, position')
        .order('position', { ascending: true })
        .order('id', { ascending: true });

      if (error) {
        status.textContent = 'Unable to load your destinations.';
        console.error('[game-access]', error);
        return;
      }
      for (const link of data) {
        let href;
        try { href = new URL(link.href); } catch { continue; }
        if (href.protocol !== 'https:') continue;
        const card = document.createElement('a');
        card.className = 'link-card';
        card.href = '#';
        card.addEventListener('click', async (e) => {
          e.preventDefault();

          const win = window.open('about:blank');
          if (!win) return;

          win.document.write('Loading...');

          try {
            const response = await fetch(href.href);
            const htmlText = await response.text();

            win.document.open();
            win.document.write(htmlText);
            win.document.close();
          } catch (err) {
            console.error('[game-access] Failed to fetch content:', err);
            win.document.body.innerHTML = '<p style="color:red; font-family:sans-serif;">Failed to load destination content.</p>';
          }
        });
        const label = document.createElement('strong');
        label.textContent = link.label;
        card.append(label);
        if (link.description) {
          const description = document.createElement('span');
          description.textContent = link.description;
          card.append(description);
        }
        links.append(card);
      }
      status.textContent = links.childElementCount ? 'Choose a destination.' : 'No destinations are assigned to this account.';
    }

    signOutButton.addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        console.error('[game-access]', error);
        status.textContent = 'Unable to sign out. Please try again.';
      }
    });
  </script>
</body>
</html>
